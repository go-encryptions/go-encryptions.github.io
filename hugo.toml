baseURL = "https://go-encryptions.github.io/"
title = "go-encryptions"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "blurb" is an honest one-paragraph description of what
# the module actually does today. "kind" groups by concern (AEAD cipher
# mode vs. disk-encryption crypto); "type" = lib vs cli.
[[params.repos]]
  name = "ccm"
  accel = "AES-CCM AEAD (NewCCM / Seal / Open)"
  kind = "aead"
  type = "lib"
  blurb = "Pure-Go CCM (Counter with CBC-MAC) per RFC 3610 and NIST SP 800-38C — the AEAD mode the standard library's crypto/cipher does not provide (it only ships GCM). Wraps any 128-bit cipher.Block as a standard cipher.AEAD, with configurable tag (4..16) and nonce (7..13) sizes. No cgo, no golang.org/x/crypto."
[[params.repos]]
  name = "zfscrypt"
  accel = "OpenZFS native-encryption crypto (read path)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go implementation of the cryptographic half of OpenZFS dataset-level (native) encryption: PBKDF2 wrapping-key derivation, master-key unwrap, HKDF-SHA512 per-block key derivation, and AES-CCM/GCM block decryption. Covers AES-128/192/256 in CCM (via ccm) and GCM (stdlib). Read path only today — enough to pull files out of an encrypted root."
[[params.repos]]
  name = "xts"
  accel = "XTS-AES, four blocks at a time (AES-NI / ARMv8 AES)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go XTS-AES (IEEE P1619, NIST SP 800-38E) — the sector-level mode LUKS, FileVault 2, BitLocker and dm-crypt use. A drop-in replacement for <code>golang.org/x/crypto/xts</code>, byte-identical output, same API; the difference is that it pipelines four AES blocks and folds the tweak XOR into the round pipeline instead of driving <code>cipher.Block</code> one 16-byte block at a time. Assembly on amd64 and arm64; riscv64, loong64, ppc64le and s390x fall back to the same per-block algorithm, so behaviour is identical everywhere and only the speed differs."
[[params.repos]]
  name = "cbc"
  accel = "AES-CBC, 8-block arm64 decryption kernel"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go AES-CBC for disk encryption, byte-identical to <code>crypto/cipher</code>. CBC decryption is parallel, so on arm64 it interleaves the rounds of 8 blocks with every round key in a register, and <code>EncryptECB</code> computes per-sector IVs (BitLocker's eboiv, LUKS's essiv) 8 at a time. Ahead of OpenSSL 3.6.5 on one core (AES-256, 4 KiB: 15.3 vs 13.0 GB/s), with zero allocations per call. Other architectures go through <code>crypto/cipher</code> with the same output."
[[params.repos]]
  name = "serpent"
  accel = "Serpent block cipher, 128/192/256-bit keys (cipher.Block)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go bitsliced Serpent (Anderson, Biham and Knudsen), a standard <code>cipher.Block</code> for 16-, 24- and 32-byte keys, in the byte order of Botan, VeraCrypt and the Linux <code>serpent</code> algorithm. Checked against all of Botan's Serpent vectors and a differential corpus generated from the Botan command line, fuzzed, and tested on big-endian s390x. Built to open VeraCrypt volumes (Serpent-XTS) through <code>xts</code>."
[[params.repos]]
  name = "camellia"
  accel = "Camellia block cipher, 128/192/256-bit keys (cipher.Block)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go Camellia (RFC 3713; Aoki, Ichikawa, Kanda, Matsui, Moriai, Nakajima and Tokita), a standard <code>cipher.Block</code> for 16-, 24- and 32-byte keys, big-endian as the specification says. Checked against the RFC 3713 Appendix A vectors, Botan's Camellia vectors and a differential corpus generated from the Botan command line, fuzzed, and tested on big-endian s390x. Built to open VeraCrypt volumes (Camellia-XTS) through <code>xts</code>."
[[params.repos]]
  name = "kuznyechik"
  accel = "Kuznyechik block cipher (GOST R 34.12-2015), 256-bit key (cipher.Block)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go Kuznyechik (GOST R 34.12-2015, RFC 7801), a standard <code>cipher.Block</code> for 32-byte keys, in the byte order of the RFC and of VeraCrypt. Checked against the RFC 7801 vectors, Botan's Kuznyechik vectors and a differential corpus generated from the Botan command line, fuzzed, and tested on big-endian s390x. Built to open VeraCrypt volumes (Kuznyechik-XTS) through <code>xts</code>."
[[params.repos]]
  name = "whirlpool"
  accel = "Whirlpool-512 hash (ISO/IEC 10118-3), hash.Hash"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go Whirlpool-512 (ISO/IEC 10118-3, the final 2003 version of Barreto and Rijmen), a standard <code>hash.Hash</code> that saves and restores its state so <code>crypto/hmac</code> and <code>crypto/pbkdf2</code> work without rehashing the key (PBKDF2 1.42x faster). Checked against the ISO vectors, the million-a vector, Botan's Whirlpool vectors and a differential corpus generated from the Botan command line, fuzzed, and tested on big-endian s390x. Built for the VeraCrypt PBKDF2 PRF."
[[params.repos]]
  name = "streebog"
  accel = "Streebog hash (GOST R 34.11-2012), 256 and 512 bits, hash.Hash"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go Streebog (GOST R 34.11-2012, RFC 6986) with 256- and 512-bit digests as standard <code>hash.Hash</code> values that save and restore their state, with the RFC's big-endian prints against the byte-string order documented. Checked against the RFC 6986 examples, Botan's Streebog vectors and a differential corpus generated from the Botan command line, fuzzed, tested on big-endian s390x, and faster than Botan on one core. Built for the VeraCrypt PBKDF2 PRF."
[[params.repos]]
  name = "twofish"
  accel = "Twofish block cipher, 128/192/256-bit keys (cipher.Block)"
  kind = "disk"
  type = "lib"
  blurb = "Pure-Go Twofish (Schneier et al., 1998), a standard <code>cipher.Block</code> for 16-, 24- and 32-byte keys, with the key-dependent S-boxes expanded into four tables per key. Checked against the designers' known-answer and Monte Carlo tests, Botan's Twofish vectors and a differential corpus generated from the Botan command line, fuzzed, and tested on big-endian s390x. An optional batched path is 1.32x faster than Botan on one core and the one-block path 2.2x faster than <code>x/crypto/twofish</code>. Built to open VeraCrypt volumes (Twofish-XTS) through <code>xts</code>."
[[params.repos]]
  name = "unixcrypt"
  accel = "crypt(3) / MCF: $1$, $5$, $6$, $2a$..$2y$"
  kind = "password"
  type = "lib"
  blurb = "Pure-Go crypt(3)/MCF password hashes: MD5-crypt, SHA-256-crypt and SHA-512-crypt per Drepper's specification, and bcrypt over the pure-Go blowfish primitive. Nothing links libc's own <code>crypt(3)</code>, so it cross-compiles and gives identical output on every Go target, big-endian s390x included. Validated against real <code>openssl passwd</code> and the canonical OpenBSD <code>bcrypt.c</code> vectors. Extracted from go-puppet/puppet's <code>pw_hash()</code> so that go-puppet and go-ansible/template share one implementation rather than each having their own."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
